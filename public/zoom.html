<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zoom Meeting</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
      #zmmtg-root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="zmmtg-root"></div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const meetingNumber = params.get("meetingNumber");
      const password = params.get("password");
      const signature = params.get("signature");
      const sdkKey = params.get("sdkKey");
      const leaveUrl = params.get("leaveUrl") || "/";
      const userName = params.get("userName") || "Guest";

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      function loadCSS(href) {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        document.head.appendChild(link);
      }

      async function initZoom() {
        try {
          loadCSS("https://source.zoom.us/3.11.0/css/bootstrap.css");

          await loadScript("https://source.zoom.us/3.11.0/lib/vendor/react.min.js");
          await loadScript("https://source.zoom.us/3.11.0/lib/vendor/react-dom.min.js");
          await loadScript("https://source.zoom.us/3.11.0/lib/vendor/redux.min.js");
          await loadScript("https://source.zoom.us/3.11.0/lib/vendor/redux-thunk.min.js");
          await loadScript("https://source.zoom.us/3.11.0/lib/vendor/lodash.min.js");
          await loadScript("https://source.zoom.us/3.11.0/zoom-meeting-3.11.0.min.js");

          ZoomMtg.setZoomJSLib("https://source.zoom.us/3.11.0/lib", "/av");
          ZoomMtg.preLoadWasm();
          ZoomMtg.prepareWebSDK();

          ZoomMtg.init({
            leaveUrl,
            success: function () {
              ZoomMtg.join({
                meetingNumber: Number(meetingNumber),
                userName: userName,
                signature,
                sdkKey,
                passWord: password,
                success: function (s) {
                  console.log("Join success", s);
                },
                error: function (e) {
                  console.error("Join error", e);
                },
              });
            },
            error: function (e) {
              console.error("Init error", e);
            },
          });
        } catch (err) {
          console.error("Script load error:", err);
        }
      }

      initZoom();
    </script>
  </body>
</html>
