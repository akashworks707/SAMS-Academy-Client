<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zoom Meeting</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }

      /* Zoom root — full screen like original, navbar floats above it */
      #zmmtg-root { width: 100%; height: 100%; }

      /* Navbar floats on top of Zoom */
      #navbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 44px;
        background: rgba(10, 15, 30, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255,255,255,0.07);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        z-index: 99999;
        gap: 12px;
      }

      .nav-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
      }
      .nav-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .nav-logo img {
        width: 28px; height: 28px;
        border-radius: 6px; object-fit: contain;
      }
      .nav-logo-name {
        font-size: 14px; font-weight: 700;
        color: #f1f5f9; white-space: nowrap;
      }
      .nav-sep {
        width: 1px; height: 18px;
        background: rgba(255,255,255,0.12);
        flex-shrink: 0;
      }
      .nav-live-dot {
        width: 7px; height: 7px;
        border-radius: 50%; background: #10b981;
        flex-shrink: 0;
        animation: livepulse 1.5s infinite;
      }
      @keyframes livepulse {
        0%,100% { opacity: 1; }
        50%      { opacity: 0.4; }
      }
      .nav-class-title {
        font-size: 13px; font-weight: 600;
        color: #e2e8f0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        max-width: 280px;
      }
      .nav-subject {
        padding: 2px 8px;
        background: rgba(59,130,246,0.18);
        border: 1px solid rgba(59,130,246,0.25);
        border-radius: 20px;
        font-size: 11px; font-weight: 600;
        color: #93c5fd;
        white-space: nowrap; flex-shrink: 0;
      }

      .nav-right {
        display: flex; align-items: center;
        gap: 10px; flex-shrink: 0;
      }
      .nav-time {
        font-size: 12px; color: #64748b; white-space: nowrap;
      }
      .nav-avatar {
        width: 26px; height: 26px;
        border-radius: 50%;
        background: linear-gradient(135deg,#1d4ed8,#7c3aed);
        display: flex; align-items: center; justify-content: center;
        font-size: 11px; font-weight: 700; color: #fff;
        flex-shrink: 0;
      }
      .nav-username {
        font-size: 12px; color: #94a3b8;
        max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .leave-btn {
        display: flex; align-items: center; gap: 5px;
        padding: 5px 12px;
        background: #dc2626; color: #fff;
        border: none; border-radius: 7px;
        font-size: 12px; font-weight: 600;
        cursor: pointer; white-space: nowrap;
        transition: background 0.15s;
      }
      .leave-btn:hover { background: #b91c1c; }
    </style>
  </head>
  <body>

    <!-- Navbar — floats above Zoom -->
    <div id="navbar">
      <div class="nav-left">
        <div class="nav-logo">
          <img src="/logos/sams-logo-en.jpeg" alt="logo" onerror="this.style.display='none'" />
          <span class="nav-logo-name">SAMS Academy</span>
        </div>
        <div class="nav-sep"></div>
        <div class="nav-live-dot"></div>
        <span class="nav-class-title" id="nav-title">Live Class</span>
        <span class="nav-subject" id="nav-subject" style="display:none"></span>
      </div>
      <div class="nav-right">
        <span class="nav-time" id="nav-time"></span>
        <div class="nav-avatar" id="nav-avatar">?</div>
        <span class="nav-username" id="nav-user"></span>
        <button class="leave-btn" onclick="window.location.href=leaveUrl">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Leave
        </button>
      </div>
    </div>

    <!-- Zoom renders here — full screen, same as original -->
    <div id="zmmtg-root"></div>

    <script>
      const params        = new URLSearchParams(window.location.search);
      const meetingNumber = params.get("meetingNumber");
      const password      = params.get("password") || "";
      const signature     = params.get("signature");
      const sdkKey        = params.get("sdkKey");
      const userName      = params.get("userName") || "Guest";
      const leaveUrl      = params.get("leaveUrl") || "/";
      const classTitle    = params.get("classTitle") || "Live Class";
      const subjectName   = params.get("subjectName") || "";

      // Populate navbar
      document.getElementById("nav-title").textContent = classTitle;
      document.getElementById("nav-user").textContent  = userName;
      document.getElementById("nav-avatar").textContent = userName.charAt(0).toUpperCase();
      if (subjectName) {
        const el = document.getElementById("nav-subject");
        el.textContent = subjectName;
        el.style.display = "inline-flex";
      }

      // Clock
      function tick() {
        document.getElementById("nav-time").textContent =
          new Date().toLocaleTimeString("en-BD", { hour:"2-digit", minute:"2-digit", hour12:true });
      }
      tick(); setInterval(tick, 1000);

      // Script loader
      function loadScript(src) {
        return new Promise((res, rej) => {
          const s = document.createElement("script");
          s.src = src; s.onload = res;
          s.onerror = () => rej(new Error("Failed: " + src));
          document.head.appendChild(s);
        });
      }
      function loadCSS(href) {
        const l = document.createElement("link");
        l.rel = "stylesheet"; l.href = href;
        document.head.appendChild(l);
      }

      // Init Zoom — identical to original working code
      async function initZoom() {
        const BASE = "https://source.zoom.us/3.11.0";
        try {
          loadCSS(BASE + "/css/bootstrap.css");
          await loadScript(BASE + "/lib/vendor/react.min.js");
          await loadScript(BASE + "/lib/vendor/react-dom.min.js");
          await loadScript(BASE + "/lib/vendor/redux.min.js");
          await loadScript(BASE + "/lib/vendor/redux-thunk.min.js");
          await loadScript(BASE + "/lib/vendor/lodash.min.js");
          await loadScript(BASE + "/zoom-meeting-3.11.0.min.js");

          ZoomMtg.setZoomJSLib(BASE + "/lib", "/av");
          ZoomMtg.preLoadWasm();
          ZoomMtg.prepareWebSDK();

          ZoomMtg.init({
            leaveUrl,
            success: function () {
              ZoomMtg.join({
                meetingNumber: Number(meetingNumber),
                userName,
                signature,
                sdkKey,
                passWord: password,
                success: function (s) { console.log("Join success", s); },
                error:   function (e) { console.error("Join error", e); },
              });
            },
            error: function (e) { console.error("Init error", e); },
          });
        } catch (err) {
          console.error("Load error:", err);
        }
      }

      initZoom();
    </script>
  </body>
</html>
